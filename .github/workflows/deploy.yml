name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Tết runner
        run: npm run build:tet-runner

      - name: Generate tin-tuc extensionless URL stubs (GitHub Pages)
        run: npm run generate-tin-tuc-clean-urls

      - name: Inject Tết SEO snippets (VN timezone)
        run: npm run inject-tet-seo

      # Mỗi lần deploy dùng cache name mới, buộc Service Worker và web
      # assets được refresh mà không cần tạo commit rác trên master.
      - name: Force-update Service Worker cache version
        run: npm run update-version

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.sha }}"

      - name: Notify successful deploy on Telegram
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🎉 Sap Tet web deploy SUCCEEDED: ${COMMIT_MESSAGE}

          👤 Pushed by: ${{ github.actor }}
          🌐 Website: https://saptet.vn
          🔎 Details: ${RUN_URL}"
