name: Daily Tết SEO snippet update

on:
  schedule:
    # 00:00 Asia/Ho_Chi_Minh (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-seo-snippets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Inject Tết SEO snippets
        run: node scripts/inject-tet-seo-snippets.js

      - name: Refresh English Tet answer
        run: node scripts/inject-tet-english-seo.js

      - name: Generate event pages
        run: node scripts/generate-event-pages.js

      - name: Refresh double-date sale countdown
        run: node scripts/generate-sale-page.js

      - name: Generate English holiday countdown pages
        run: node scripts/generate-holiday-pages.js

      - name: Refresh Vietnamese Noel countdown
        run: node scripts/inject-seasonal-seo-snippets.js

      - name: Inject lunar calendar snapshot
        run: node scripts/inject-lunar-today.js

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html con-bao-nhieu-ngay-nua-den-tet/index.html con-bao-nhieu-ngay-nua-den-giao-thua/index.html when-is-tet-in-vietnam/index.html lich-am-hom-nay.html su-kien-quan-trong.html su-kien sap-san-sale/index.html sitemap.xml countdowns.html halloween.html sap-halloween/index.html noel.html diwali.html thanksgiving.html hanukkah.html christmas.html new-year.html chinese-new-year.html ramadan.html valentines-day.html eid-al-fitr.html easter.html songkran.html ar
          if git diff --staged --quiet; then
            echo "No SEO snippet changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(seo): refresh Tết day-count and lunar snippets [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not start push-triggered workflows; dispatch explicitly.
      - name: Publish refreshed pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            --data '{"ref":"master"}'
